name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      name:
        description: 'Version name (default is ref name)'

env:
  # Used by release scripts. Slashes in branch names are sanitized in
  # release/build_common so they are safe as filenames.
  VERSION: ${{ github.event.inputs.name || github.ref_name }}

jobs:
  test-dep-download-retry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test get_file retries
        run: bash app/deps/test_get_file.sh

  build-win32:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm ffmpeg libsdl2-2.0-0 \
             libsdl2-dev libavcodec-dev libavdevice-dev libavformat-dev \
             libavutil-dev libswresample-dev libusb-1.0-0 libusb-1.0-0-dev \
             mingw-w64 mingw-w64-tools libz-mingw-w64-dev

      - name: Build
        run: release/build_windows.sh 32

      # upload-artifact does not preserve permissions
      - name: Tar
        run: |
          cd release/work/build-win32
          mkdir dist-tar
          cd dist-tar
          tar -C .. -cvf dist.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-win32-intermediate
          path: release/work/build-win32/dist-tar/

  build-win64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm ffmpeg libsdl2-2.0-0 \
             libsdl2-dev libavcodec-dev libavdevice-dev libavformat-dev \
             libavutil-dev libswresample-dev libusb-1.0-0 libusb-1.0-0-dev \
             mingw-w64 mingw-w64-tools libz-mingw-w64-dev

      - name: Build
        run: release/build_windows.sh 64

      # upload-artifact does not preserve permissions
      - name: Tar
        run: |
          cd release/work/build-win64
          mkdir dist-tar
          cd dist-tar
          tar -C .. -cvf dist.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-win64-intermediate
          path: release/work/build-win64/dist-tar/

  package-win32:
    needs:
      - build-win32
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build-win32
        uses: actions/download-artifact@v4
        with:
          name: build-win32-intermediate
          path: release/work/build-win32/dist-tar/

      # upload-artifact does not preserve permissions
      - name: Detar
        run: |
          cd release/work/build-win32
          tar xf dist-tar/dist.tar.gz

      - name: Package
        env:
          SKIP_SERVER: "1"
        run: release/package_client.sh win32 zip

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: release-win32
          path: release/output/

  package-win64:
    needs:
      - build-win64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build-win64
        uses: actions/download-artifact@v4
        with:
          name: build-win64-intermediate
          path: release/work/build-win64/dist-tar/

      # upload-artifact does not preserve permissions
      - name: Detar
        run: |
          cd release/work/build-win64
          tar xf dist-tar/dist.tar.gz

      - name: Package
        env:
          SKIP_SERVER: "1"
        run: release/package_client.sh win64 zip

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: release-win64
          path: release/output

  release:
    needs:
      - test-dep-download-retry
      - package-win32
      - package-win64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release-win32
        uses: actions/download-artifact@v4
        with:
          name: release-win32
          path: release/output/

      - name: Download release-win64
        uses: actions/download-artifact@v4
        with:
          name: release-win64
          path: release/output/

      - name: Generate checksums
        run: |
          cd release/output
          sha256sum scrcpy-win32-*.zip scrcpy-win64-*.zip | tee SHA256SUMS.txt

      - name: Sanitize artifact name
        run: echo "ARTIFACT_VERSION=${VERSION//\//-}" >> "$GITHUB_ENV"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-release-${{ env.ARTIFACT_VERSION }}
          path: release/output

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          基于 [scrcpy](https://github.com/Genymobile/scrcpy) 3.3.4 的增强版。

          ### 本 fork 新增
          - 启动时无设备或多设备弹出选择窗口
          - 支持 `SCRCPY_REMOTE` 远程连接配置

          ### 下载
          - Windows 64-bit：`scrcpy-win64-${{ github.ref_name }}.zip`
          - Windows 32-bit：`scrcpy-win32-${{ github.ref_name }}.zip`

          SHA256 校验和见 `SHA256SUMS.txt`。
          EOF
          shopt -s nullglob
          files=(release/output/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No files in release/output" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "myScrcpyEx $GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            "${files[@]}"
